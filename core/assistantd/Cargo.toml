[package]
name = "assistantd"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Local Assistant 2.0 per-user core prototype"

[dependencies]
nix = { version = "=0.30.1", features = ["user", "process", "signal"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tokio = { version = "=1.54.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time", "process"] }
